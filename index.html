<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paddock Vault</title>
<meta name="description" content="">
<meta name="theme-color" content="#15151E">
<meta property="og:title" content="">
<meta property="og:description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: { extend: {
      colors: { carbon: '#15151E', f1: '#E10600' },
      fontFamily: { sans: ['"Titillium Web"', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'] }
    } }
  };
</script>

<!--
  PADDOCK VAULT v2 — League history template
  Edit the CONFIG object near the bottom of this file. See README.md for the full guide.
  This file uses no localStorage, sessionStorage, cookies or parent-frame access:
  all state lives in memory, so it runs safely inside sandboxed previews and iframes.
-->

<style>
  :root{
    --bg:#15151E; --accent:#E10600; --accent-rgb:225,6,0;
    --line:rgba(255,255,255,.09); --muted:#9c9cab; --text:#f3f3f6;
    --font:"Titillium Web",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }
  *,*::before,*::after{ -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html{ -webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.5;
        padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); overflow-x:hidden; }
  body.lock{ overflow:hidden; }
  :focus-visible{ outline:2px solid #fff; outline-offset:3px; border-radius:10px; }

  .bg{ position:fixed; inset:0; z-index:-1; pointer-events:none; background:
      radial-gradient(900px 520px at 90% -8%, rgba(var(--accent-rgb),.18), transparent 62%),
      radial-gradient(700px 500px at -10% 110%, rgba(var(--accent-rgb),.08), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.35) 0 2px, transparent 2px 6px), var(--bg); }
  .glass{ background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.02)); border:1px solid var(--line);
          -webkit-backdrop-filter:blur(14px) saturate(140%); backdrop-filter:blur(14px) saturate(140%); }
  .muted{ color:var(--muted); }

  /* Intro */
  #intro{ position:fixed; inset:0; z-index:100; background:#000; display:grid; place-items:center; cursor:pointer; transition:opacity .6s ease .1s, visibility .6s ease .1s; }
  #intro.done{ opacity:0; visibility:hidden; }
  .gantry{ display:flex; gap:clamp(6px,2.4vw,16px); padding:14px; background:#0b0b0d; border:1px solid #222; border-radius:16px; }
  .pod{ display:flex; flex-direction:column; gap:8px; padding:8px; background:#030303; border-radius:12px; }
  .lamp{ width:clamp(30px,10vw,54px); aspect-ratio:1; border-radius:50%; background:#1d0505; box-shadow:inset 0 0 10px #000; transition:background .06s, box-shadow .06s; }
  .pod.on .lamp{ background:#ff1b0d; box-shadow:0 0 22px #ff1b0d, 0 0 60px rgba(255,27,13,.55), inset 0 -5px 10px rgba(0,0,0,.35); }
  #intro-text{ margin-top:28px; font-weight:700; font-size:clamp(18px,4.6vw,26px); text-align:center; opacity:0; transform:translateY(8px); transition:opacity .35s, transform .35s; }
  #intro-text.show{ opacity:1; transform:none; }

  /* Header + nav pills */
  .brand-mark{ width:34px; height:22px; flex:none; background:var(--accent); transform:skewX(-20deg); border-radius:3px; box-shadow:0 0 18px rgba(var(--accent-rgb),.55); }
  .meta-pill{ display:inline-flex; align-items:baseline; gap:6px; padding:6px 12px; border-radius:999px; font-size:14px; color:var(--muted); background:rgba(0,0,0,.35); border:1px solid var(--line); }
  .meta-pill b{ color:#fff; font-weight:700; }
  .nav-pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:700; white-space:nowrap;
             background:rgba(var(--accent-rgb),.12); border:1px solid rgba(var(--accent-rgb),.45); color:#fff; transition:box-shadow .3s, background .3s, transform .2s; }
  .nav-pill i{ color:var(--accent); filter:brightness(1.3); }
  .nav-pill:hover{ background:rgba(var(--accent-rgb),.22); box-shadow:0 0 22px rgba(var(--accent-rgb),.45); }
  .nav-pill:active{ transform:scale(.96); }

  /* Tabs */
  .tabs{ position:relative; display:grid; grid-template-columns:repeat(3,1fr); padding:4px; border-radius:999px; max-width:36rem; }
  .tab-ind{ position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px) / 3); border-radius:999px; background:var(--accent);
            box-shadow:0 0 22px rgba(var(--accent-rgb),.55), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .5s cubic-bezier(.65,0,.35,1); }
  .tab{ position:relative; z-index:1; padding:11px 6px; font-weight:700; font-size:clamp(13px,3.6vw,15px); color:#b8b8c6; border-radius:999px; transition:color .3s; white-space:nowrap; }
  .tab[aria-selected="true"]{ color:#fff; }

  /* Story rail — touch + mouse drag, hidden scrollbar, glowing active ring */
  .rail{ display:flex; gap:14px; overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;
         scroll-snap-type:x proximity; scroll-behavior:smooth; padding:10px 6px 12px; margin-top:12px; cursor:grab;
         scrollbar-width:none; -ms-overflow-style:none; touch-action:pan-x pan-y;
         -webkit-mask-image:linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent);
         mask-image:linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent); }
  .rail::-webkit-scrollbar{ display:none; width:0; height:0; }
  .rail.dragging{ cursor:grabbing; scroll-snap-type:none; scroll-behavior:auto; user-select:none; }
  .bubble{ flex:none; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; gap:7px; width:82px; padding:4px 0; border-radius:16px; }
  .ring{ width:76px; height:76px; border-radius:50%; padding:3px; background:conic-gradient(from 210deg, var(--accent), #ff7a5c, #ffc2b3, var(--accent));
         transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
  .ring.seen{ background:#3b3b48; }
  .ring-inner{ width:100%; height:100%; border-radius:50%; background:#000; border:3px solid var(--bg); display:grid; place-items:center; font-weight:900; font-size:19px; letter-spacing:-.02em; }
  .bubble[aria-selected="true"] .ring{ background:var(--accent); transform:scale(1.08);
         box-shadow:0 0 0 2px rgba(var(--accent-rgb),.35), 0 0 18px rgba(var(--accent-rgb),.85), 0 0 42px rgba(var(--accent-rgb),.45); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 4px rgba(var(--accent-rgb),.2), 0 0 26px rgba(var(--accent-rgb),.95), 0 0 56px rgba(var(--accent-rgb),.5); } }
  .bubble:active .ring{ transform:scale(.94); }
  .bubble-label{ font-size:13px; line-height:1.15; color:#c9c9d4; text-align:center; }
  .bubble[aria-selected="true"] .bubble-label{ color:#fff; font-weight:700; }
  @media (hover:hover){ .bubble:hover .ring{ transform:scale(1.05); } }

  /* Chapter detail */
  .ghost{ position:absolute; right:-.04em; top:-.16em; font-size:clamp(120px,32vw,280px); font-weight:700; font-style:italic; line-height:1; letter-spacing:-.05em;
          color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.08); pointer-events:none; user-select:none; }
  .pill{ padding:3px 10px; border-radius:999px; background:var(--accent); color:#fff; font-weight:700; box-shadow:0 0 14px rgba(var(--accent-rgb),.55); font-size:14px; }
  .chip{ display:inline-flex; flex-direction:column; gap:2px; padding:10px 14px; border-radius:14px; background:rgba(0,0,0,.42); border:1px solid var(--line); font-size:15px; line-height:1.3; }
  .chip small{ color:var(--muted); font-size:13px; }
  .stat{ padding:16px; border-radius:18px; background:rgba(0,0,0,.4); border:1px solid var(--line); }
  .stat-v{ font-size:clamp(28px,7vw,42px); font-weight:900; line-height:1; letter-spacing:-.02em; color:#fff; text-shadow:0 0 22px rgba(var(--accent-rgb),.45); overflow-wrap:anywhere; }
  .stat-l{ margin-top:8px; font-size:14px; line-height:1.4; color:#c4c4cf; }
  .list{ list-style:none; padding:0; margin:0; display:grid; gap:2px; }
  .list li{ display:grid; grid-template-columns:56px 1fr; gap:10px; padding:8px 4px; border-bottom:1px solid rgba(255,255,255,.06); font-size:15px; }
  .list li span:first-child{ color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; filter:brightness(1.25); }
  .fact{ border-left:3px solid var(--accent); background:linear-gradient(90deg, rgba(var(--accent-rgb),.14), transparent 80%); padding:14px 16px; border-radius:4px 16px 16px 4px; font-size:15px; line-height:1.55; }
  .fact strong{ display:block; font-size:13px; color:#ff9a90; margin-bottom:4px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:999px; font-weight:700; font-size:14px;
        border:1px solid var(--line); background:rgba(255,255,255,.05); color:#fff; transition:background .25s, box-shadow .25s, transform .2s, opacity .2s; }
  .btn:hover{ background:rgba(255,255,255,.1); }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.35; pointer-events:none; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); }
  .btn-accent:hover{ background:var(--accent); filter:brightness(1.12); box-shadow:0 0 26px rgba(var(--accent-rgb),.55); }

  /* Newsletter */
  .cta{ position:relative; overflow:hidden; border-radius:26px; }
  .cta::before{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(500px 220px at 100% 0%, rgba(var(--accent-rgb),.28), transparent 70%); }
  .field{ display:flex; align-items:center; gap:10px; padding:0 14px; height:48px; border-radius:999px; background:rgba(0,0,0,.5); border:1px solid var(--line); transition:border-color .25s, box-shadow .25s; }
  .field:focus-within{ border-color:rgba(var(--accent-rgb),.7); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18); }
  .field input{ flex:1; min-width:0; background:transparent; border:0; outline:0; color:#fff; font-size:16px; font-family:var(--font); }
  .field input::placeholder{ color:#6f6f7d; }
  .field i{ color:var(--muted); }
  .field input[type="search"]::-webkit-search-cancel-button{ display:none; }
  .field-error{ min-height:20px; font-size:13px; color:#ff9a90; margin-top:6px; }

  /* Cards with cursor glow */
  .spot{ position:relative; isolation:isolate; transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s; }
  .spot::after{ content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
    background:radial-gradient(240px circle at var(--x,50%) var(--y,0%), rgba(var(--accent-rgb),1), rgba(var(--accent-rgb),.25) 40%, transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .35s; }
  .spot:focus-visible::after{ opacity:1; }
  @media (hover:hover){
    .spot:hover{ transform:translateY(-4px); box-shadow:0 20px 50px -20px rgba(var(--accent-rgb),.6); border-color:rgba(var(--accent-rgb),.35); }
    .spot:hover::after{ opacity:1; }
  }
  .person{ text-align:left; border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:14px; min-height:200px; }
  .helmet{ position:relative; flex:none; width:48px; height:44px; border-radius:50% 50% 42% 42% / 58% 58% 42% 42%;
           background:linear-gradient(165deg, var(--c1) 0 50%, var(--c2) 50% 64%, var(--c1) 64%); box-shadow:inset -5px -7px 12px rgba(0,0,0,.38), 0 6px 16px rgba(0,0,0,.5); }
  .helmet::after{ content:""; position:absolute; right:-2px; top:36%; width:62%; height:27%; border-radius:12px 4px 4px 12px; background:linear-gradient(180deg,#2a2a2a,#000); box-shadow:inset 0 2px 0 rgba(255,255,255,.18); }
  .helmet.lg{ width:72px; height:66px; }
  .first{ display:block; font-size:15px; color:var(--muted); line-height:1.2; }
  .last{ display:block; font-size:28px; font-weight:900; line-height:1.05; letter-spacing:-.02em; }
  .pips{ display:flex; flex-wrap:wrap; gap:4px; min-height:5px; }
  .pips i{ width:14px; height:5px; border-radius:2px; background:var(--accent); box-shadow:0 0 8px rgba(var(--accent-rgb),.55); transform:skewX(-20deg); }
  .mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; }
  .mini div{ font-size:12px; color:var(--muted); line-height:1.25; }
  .mini b{ display:block; font-size:19px; color:#fff; font-weight:700; }
  .sort-btn{ padding:7px 14px; border-radius:999px; font-size:14px; font-weight:600; color:#c4c4cf; border:1px solid var(--line); transition:background .25s, color .25s, border-color .25s; }
  .sort-btn[aria-pressed="true"]{ background:#fff; color:#000; border-color:#fff; }
  mark{ background:rgba(var(--accent-rgb),.35); color:#fff; border-radius:3px; padding:0 1px; }

  /* Rivalries */
  .heat{ display:flex; gap:3px; align-items:center; }
  .heat i{ width:7px; height:14px; border-radius:2px; background:rgba(255,255,255,.12); transform:skewX(-18deg); }
  .heat i.on{ background:var(--accent); box-shadow:0 0 8px rgba(var(--accent-rgb),.55); }
  .vs{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:end; gap:10px; margin-top:20px; }
  .vs-name{ font-size:clamp(24px,6vw,40px); font-weight:900; line-height:.95; letter-spacing:-.02em; overflow-wrap:break-word; hyphens:auto; }
  @media (min-width:1024px){ .vs-name{ font-size:clamp(24px,2.6vw,36px); } }
  .vs-badge{ font-weight:700; font-style:italic; color:var(--accent); font-size:20px; padding-bottom:4px; filter:brightness(1.2); }
  .tug{ display:grid; grid-template-columns:56px 1fr 56px; align-items:center; gap:10px; }
  .tug-label{ grid-column:1 / -1; text-align:center; font-size:13px; color:var(--muted); margin-bottom:-4px; }
  .tug-val{ font-weight:700; font-variant-numeric:tabular-nums; font-size:16px; color:#cfcfd8; }
  .tug-val.win{ color:#fff; }
  .tug-bar{ display:flex; height:8px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.08); }
  .tug-bar .l{ background:var(--accent); box-shadow:0 0 10px rgba(var(--accent-rgb),.55); transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .tug-bar .r{ background:#e6e6ee; transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .note h4{ font-size:13px; color:#ff9a90; font-weight:700; margin:0 0 4px; }
  .note p{ margin:0; font-size:15px; line-height:1.55; color:#d6d6de; }

  /* Toast */
  .toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:120; display:flex; align-items:center; gap:10px;
          padding:12px 18px; border-radius:999px; background:rgba(10,10,14,.92); border:1px solid rgba(var(--accent-rgb),.5); color:#fff; font-weight:600; font-size:15px;
          box-shadow:0 12px 40px -10px rgba(0,0,0,.8), 0 0 24px rgba(var(--accent-rgb),.35); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
          transform:translate(-50%, 24px); opacity:0; pointer-events:none; transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; max-width:calc(100vw - 32px); }
  .toast.show{ transform:translate(-50%,0); opacity:1; }
  .toast i{ color:var(--accent); filter:brightness(1.3); }

  /* Motion */
  @keyframes rise{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .rise{ animation:rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 55ms); }

  /* Modals */
  .modal{ position:fixed; inset:0; z-index:60; display:none; }
  .modal.show{ display:block; }
  .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); opacity:0; transition:opacity .35s; }
  .modal.open .backdrop{ opacity:1; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto; overscroll-behavior:contain; border-radius:28px 28px 0 0;
          background:rgba(21,21,30,.95); border:1px solid var(--line); padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));
          transform:translateY(100%); transition:transform .45s cubic-bezier(.2,.8,.2,1); }
  .modal.open .sheet{ transform:none; }
  .handle{ width:44px; height:5px; border-radius:99px; background:rgba(255,255,255,.25); margin:0 auto 14px; }
  @media (min-width:768px){
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:min(640px,92vw); border-radius:28px; padding:28px; opacity:0; transform:translate(-50%,-46%) scale(.97); transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s; }
    .modal.open .sheet{ opacity:1; transform:translate(-50%,-50%); }
    .handle{ display:none; }
  }
  .quote{ position:relative; padding:18px 18px 18px 22px; border-radius:18px; background:rgba(0,0,0,.45); border:1px solid var(--line); margin-top:24px; }
  .quote::before{ content:"“"; position:absolute; left:12px; top:-14px; font-size:64px; font-weight:900; color:var(--accent); line-height:1; }
  .quote p{ margin:0; font-size:18px; line-height:1.45; font-weight:600; }
  .quote small{ display:block; margin-top:8px; color:var(--muted); font-size:13px; }
  .tag{ display:inline-block; padding:5px 10px; border-radius:10px; font-size:13px; background:rgba(255,255,255,.06); border:1px solid var(--line); }
  .tag.hot{ background:rgba(var(--accent-rgb),.18); border-color:rgba(var(--accent-rgb),.45); color:#fff; font-weight:700; }
  .x{ width:40px; height:40px; flex:none; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.08); border:1px solid var(--line); font-size:16px; line-height:1; }

  .story{ position:absolute; inset:0; overflow:hidden; display:flex; flex-direction:column; background:#000;
          padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));
          opacity:0; transform:scale(.95); transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s; }
  #story-modal.open .story{ opacity:1; transform:none; }
  @media (min-width:640px){
    .story{ inset:auto; left:50%; top:50%; width:min(420px,92vw); height:min(780px,92vh); border-radius:26px; border:1px solid var(--line); transform:translate(-50%,-50%) scale(.95); padding:14px 18px 20px; }
    #story-modal.open .story{ transform:translate(-50%,-50%); }
  }
  .story-glow{ position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 70% at 100% 0%, rgba(var(--accent-rgb),.42), transparent 60%), radial-gradient(90% 60% at 0% 100%, rgba(var(--accent-rgb),.16), transparent 60%); }
  .bars{ position:relative; display:flex; gap:4px; }
  .bar{ flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden; }
  .bar i{ display:block; height:100%; width:0; background:#fff; }
  .stage{ position:relative; flex:1; display:flex; flex-direction:column; justify-content:flex-end; touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer; }
  .stage .ghost{ top:2%; font-size:clamp(130px,42vw,200px); -webkit-text-stroke:1.5px rgba(255,255,255,.13); }
  .paused-hint{ position:absolute; top:44px; left:50%; transform:translateX(-50%); font-size:13px; padding:4px 10px; border-radius:99px; background:rgba(0,0,0,.6); opacity:0; transition:opacity .2s; pointer-events:none; }
  .story.paused .paused-hint{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important; }
    .rail{ scroll-behavior:auto; }
  }
</style>
</head>
<body class="antialiased">
<div class="bg" aria-hidden="true"></div>

<!-- Starting-lights intro -->
<div id="intro" role="presentation">
  <div>
    <div class="gantry" aria-hidden="true">
      <div class="pod"><span class="lamp"></span><span class="lamp"></span></div>
      <div class="pod"><span class="lamp"></span><span class="lamp"></span></div>
      <div class="pod"><span class="lamp"></span><span class="lamp"></span></div>
      <div class="pod"><span class="lamp"></span><span class="lamp"></span></div>
      <div class="pod"><span class="lamp"></span><span class="lamp"></span></div>
    </div>
    <p id="intro-text"></p>
    <p class="mt-3 text-center text-[13px] text-zinc-500" id="intro-skip"></p>
  </div>
</div>

<div class="mx-auto w-full max-w-6xl px-4 sm:px-6 pb-16">
  <!-- Header / top navigation -->
  <header class="pt-6 sm:pt-10">

      <p class="rise mt-2 text-[17px] font-semibold text-zinc-200" style="--i:1">${esc(c.tagline)}</p>
      <div class="rise mt-5 grid grid-cols-2 gap-3" style="--i:2">${(c.stats || []).map(s => `<div class="stat"><div class="stat-v" style="font-size:30px">${esc(s.v)}</div><div class="stat-l" style="font-size:13px">${esc(s.l)}</div></div>`).join('')}</div>
      ${c.fact ? `<div class="fact rise mt-4" style="--i:3"><strong>${esc(L.factLabel)}</strong>${esc(c.fact)}</div>` : ''}
      <button class="btn w-full mt-5" data-open>${esc(L.openFull)}</button>
    </div>`;
  paintBars();
}
function paintBars() { $$('#bars .bar i').forEach((el, k) => el.style.width = k < story.i ? '100%' : k > story.i ? '0%' : `${Math.min(story.p, 1) * 100}%`); }
function tick(t) {
  if (!story.paused && !reduceMotion) story.p += (t - story.last) / story.dur;
  story.last = t; paintBars();
  if (story.p >= 1) goStory(story.i + 1);
  if ($('#story-modal').classList.contains('show')) story.raf = requestAnimationFrame(tick);
}
function setPaused(v) { story.paused = v; frame.classList.toggle('paused', v); }
$('#story-close').addEventListener('click', closeStory);
$('#story-modal').addEventListener('click', e => { if (e.target.classList.contains('backdrop')) closeStory(); });
$('#play-all').addEventListener('click', () => openStory(0));
stage.addEventListener('click', e => { if (e.target.closest('[data-open]')) { closeStory(); setTab(0); } });
(() => {
  let t0 = 0, x0 = 0, y0 = 0, hold = 0, held = false, down = false;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return; down = true; held = false; t0 = Date.now(); x0 = e.clientX; y0 = e.clientY;
    hold = setTimeout(() => { held = true; setPaused(true); }, 200);
  });
  stage.addEventListener('pointerup', e => {
    if (!down) return; down = false; clearTimeout(hold);
    const dx = e.clientX - x0, dy = e.clientY - y0; setPaused(false);
    if (dy > 90 && Math.abs(dy) > Math.abs(dx)) return closeStory();
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) return goStory(story.i + (dx < 0 ? 1 : -1));
    if (!held && Date.now() - t0 < 300) { const r = stage.getBoundingClientRect(); goStory(e.clientX - r.left < r.width / 3 ? story.i - 1 : story.i + 1); }
  });
  stage.addEventListener('pointercancel', () => { down = false; clearTimeout(hold); setPaused(false); });
})();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) setPaused(true);
  else if ($('#story-modal').classList.contains('show')) { story.last = performance.now(); setPaused(false); }
});
document.addEventListener('keydown', e => {
  if ($('#story-modal').classList.contains('show')) {
    if (e.key === 'Escape') closeStory();
    if (e.key === 'ArrowRight') goStory(story.i + 1);
    if (e.key === 'ArrowLeft') goStory(story.i - 1);
    if (e.key === ' ') { e.preventDefault(); setPaused(!story.paused); }
    return;
  }
  if (e.key === 'Escape') closeModal($('#sheet-modal'));
});

/* Intro */
function runIntro() {
  const el = $('#intro'), pods = $$('.pod', el); let done = false;
  const finish = () => { if (done) return; done = true; el.classList.add('done'); replayRise(panels[state.tab]); };
  el.addEventListener('click', finish);
  if (!CONFIG.intro.enabled || reduceMotion) { finish(); return; }
  let k = 0;
  const step = () => { if (done) return; if (k < pods.length) { pods[k++].classList.add('on'); setTimeout(step, 320); } else setTimeout(out, 500 + Math.random() * 600); };
  const out = () => { if (done) return; pods.forEach(p => p.classList.remove('on')); $('#intro-text').classList.add('show'); setTimeout(finish, 750); };
  setTimeout(step, 350);
}

/* Boot */
applyTheme(); applyText(); renderNavLinks();
renderRail(); renderChapter(); renderNewsletter(); renderPeople(); renderRivalries();
setTab(0, { push: false });
routeFromHash();
runIntro();
</script>
